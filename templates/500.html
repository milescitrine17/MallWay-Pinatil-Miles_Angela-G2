<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error &bull; MallWay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f7f9fc 0%, #eff6ff 50%, #f0fdfa 100%);
            color: #475569;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 28px -4px rgba(30, 41, 59, 0.08);
        }
        .error-code {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
        }
        .code-404 { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .code-403 { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
        .code-500 { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .error-icon { font-size: 3rem; margin-bottom: 16px; }
        h1 { font-size: 1.65rem; font-weight: 700; color: #1e293b; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { font-size: 0.95rem; line-height: 1.65; color: #64748b; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 10px; font-size: 0.9rem;
            font-weight: 600; text-decoration: none; transition: all 0.2s ease;
        }
        .btn-primary { background: #3b82f6; color: #ffffff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">🛠️</div>
        <span class="error-code code-500">Error 500 &bull; Server Error</span>
        <h1>Something Went Wrong</h1>
        <p>MallWay encountered an unexpected internal error while processing your request. Please try again in a moment.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Return Home</a>
        </div>
    </div>
</body>
</html>
